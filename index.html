<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Experiencia AR</title>

  <!-- LIBRERÍAS -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- QR Desktop -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      color: #f3f0ea;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }

    .a-enter-vr-button {
      display: none !important;
    }

    /* ===============================
       DESKTOP VIEW
    =============================== */

    #desktop-view {
      display: none;
      min-height: 100vh;
      padding: 60px 40px;
      overflow-y: auto;
      background:
        radial-gradient(circle at 20% 10%, rgba(180,140,90,0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 90%, rgba(90,120,180,0.10) 0%, transparent 50%),
        #0a0a0a;
    }

    #desktop-view.active {
      display: block;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.06;
      z-index: 1;
      background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 60px;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      opacity: 0.55;
      margin-bottom: 24px;
    }

    h1 {
      font-family: "Instrument Serif", serif;
      font-weight: 400;
      font-size: clamp(2.5rem, 5vw, 4.2rem);
      line-height: 1.05;
      margin: 0 0 24px;
    }

    h1 em {
      font-style: italic;
      color: #d4b48a;
    }

    .lead {
      font-size: 1.05rem;
      line-height: 1.65;
      opacity: 0.75;
      max-width: 460px;
      margin-bottom: 36px;
    }

    .steps {
      list-style: none;
      padding: 0;
      margin: 0 0 36px;
      counter-reset: step;
    }

    .steps li {
      counter-increment: step;
      padding: 14px 0;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 0.95rem;
      opacity: 0.85;
      display: flex;
      gap: 16px;
    }

    .steps li::before {
      content: counter(step, decimal-leading-zero);
      font-family: "JetBrains Mono", monospace;
      color: #d4b48a;
      min-width: 28px;
    }

    .marker-card {
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    }

    .marker-card img {
      width: 100%;
      display: block;
    }

    .qr-block {
      margin-top: 28px;
      display: flex;
      gap: 18px;
      align-items: center;
      padding: 18px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
    }

    #qrcode {
      background: white;
      padding: 8px;
    }

    /* ===============================
       MOBILE AR VIEW
    =============================== */

    #mobile-ar {
      display: none;
      position: fixed;
      inset: 0;
    }

    #mobile-ar.active {
      display: block;
    }

    #intro-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeInOut 4s ease-in-out forwards;
      overflow: hidden;
    }

    #intro-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      animation: fadeImage 3s ease-in-out forwards;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes fadeImage {
      0% { opacity: 0; }
      30% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; }
    }

    #control-buttons {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 20px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .control-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      cursor: pointer;
    }

    @media (max-width: 800px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="grain"></div>

<!-- =====================================
     DESKTOP
===================================== -->
<div id="desktop-view">
  <div class="container">
    <div>
      <div class="eyebrow">Realidad Aumentada</div>
      <h1>Escanea, <em>observa</em>,<br>déjate llevar.</h1>

      <p class="lead">
        Esta experiencia está pensada para celular.
        Escanea el QR y abre la experiencia AR en tu teléfono.
      </p>

      <ol class="steps">
        <li>Escanea el código QR.</li>
        <li>Permite acceso a la cámara.</li>
        <li>Apunta al marcador.</li>
      </ol>

      <div class="qr-block">
        <div id="qrcode"></div>
      </div>
    </div>

    <div class="marker-card">
      <img src="https://cdn.jsdelivr.net/gh/St3phen27/astra-ar@main/assets/inicio.jpg">
    </div>
  </div>
</div>

<!-- =====================================
     MOBILE AR
===================================== -->
<div id="mobile-ar">

  <div id="intro-container">
    <img id="intro-image"
         src="https://cdn.jsdelivr.net/gh/St3phen27/astra-ar@main/assets/inicio.jpg">
  </div>

  <div id="control-buttons">
    <button id="play-pause-btn" class="control-btn">
      <i class="fas fa-pause"></i>
    </button>

    <button id="restart-btn" class="control-btn">
      <i class="fas fa-redo"></i>
    </button>

    <button id="mute-btn" class="control-btn">
      <i class="fas fa-volume-up"></i>
    </button>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/St3phen27/astra-ar@main/assets/targets.mind; filterMinCF: 0.001; filterBeta: 0.01;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights">

    <a-assets>
      <video id="video0"
             src="https://cdn.jsdelivr.net/gh/St3phen27/astra-ar@main/assets/video.mp4"
             preload="auto"
             loop
             playsinline
             webkit-playsinline
             crossorigin="anonymous">
      </video>

      <img id="mask0"
           src="https://cdn.jsdelivr.net/gh/St3phen27/astra-ar@main/assets/mask.jpg">

      <img id="frame0"
           src="https://cdn.jsdelivr.net/gh/St3phen27/astra-ar@main/assets/frame.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target0" mindar-image-target="targetIndex: 0">
      <a-entity id="markerGroup0">

        <a-plane id="plane0"
                 src="#video0"
                 width="1"
                 height="0.6">
        </a-plane>

        <a-image id="overlay0"
                 src="#frame0"
                 position="0 0 0.01"
                 material="transparent: true; alphaTest: 0.5">
        </a-image>

      </a-entity>
    </a-entity>
  </a-scene>
</div>

<script>

function isMobile() {
  return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
      || (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent));
}

// =========================
// MOBILE
// =========================
if (isMobile()) {

  document.getElementById('mobile-ar').classList.add('active');

  const video = document.getElementById('video0');
  const target = document.getElementById('target0');

  target.addEventListener('targetFound', () => {
    video.play();
  });

  target.addEventListener('targetLost', () => {
    video.pause();
  });

  setTimeout(() => {
    document.getElementById('intro-container').style.display = 'none';
    document.getElementById('control-buttons').style.opacity = '1';
  }, 4000);

  // Botones
  document.getElementById('play-pause-btn').addEventListener('click', () => {
    if (video.paused) {
      video.play();
    } else {
      video.pause();
    }
  });

  document.getElementById('restart-btn').addEventListener('click', () => {
    video.currentTime = 0;
    video.play();
  });

  document.getElementById('mute-btn').addEventListener('click', () => {
    video.muted = !video.muted;
  });

}

// =========================
// DESKTOP
// =========================
else {

  document.getElementById('desktop-view').classList.add('active');

  new QRCode(document.getElementById('qrcode'), {
    text: window.location.href,
    width: 110,
    height: 110,
    colorDark: '#0a0a0a',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
}

</script>

</body>
</html>
