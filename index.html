<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Astra — Experiencia AR</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            background: #0a0a0a;
            color: #f3f0ea;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            height: 100%;
        }

        .grain {
            position: fixed; inset: 0;
            pointer-events: none;
            opacity: 0.06;
            z-index: 1;
            background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        }

        /* =========================================================
           VISTA DESKTOP (PC)
           ========================================================= */
        #desktop-view {
            display: none;
            min-height: 100vh;
            padding: 60px 40px;
            background: radial-gradient(circle at 20% 10%, rgba(180,140,90,0.12) 0%, transparent 50%), #0a0a0a;
        }
        #desktop-view.active { display: flex; align-items: center; justify-content: center; }

        .container {
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 60px;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-family: "Instrument Serif", serif;
            font-weight: 400;
            font-size: clamp(2.5rem, 5vw, 4.2rem);
            line-height: 1.05;
            margin: 0 0 24px;
        }
        h1 em { color: #d4b48a; font-style: italic; }
        
        .steps { list-style: none; padding: 0; margin-bottom: 36px; }
        .steps li { 
            padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.08); 
            font-size: 0.95rem; opacity: 0.8; 
        }

        .qr-block {
            display: flex; gap: 18px; align-items: center;
            padding: 18px; background: rgba(255,255,255,0.03);
            border-radius: 4px;
        }
        #qrcode { background: #fff; padding: 8px; border-radius: 2px; }

        .marker-card { border-radius: 4px; overflow: hidden; background: #111; box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
        .marker-card img { width: 100%; display: block; }

        /* =========================================================
           VISTA MOBILE (Redirección)
           ========================================================= */
        #mobile-landing {
            display: none;
            position: fixed; inset: 0;
            background: #0a0a0a;
            z-index: 10;
            flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center;
            padding: 40px;
        }
        #mobile-landing.active { display: flex; }

        #mobile-landing h2 {
            font-family: "Instrument Serif", serif;
            font-size: 2.8rem; margin: 0 0 20px; font-weight: 400;
        }
        #mobile-landing p { opacity: 0.6; line-height: 1.6; margin-bottom: 40px; max-width: 280px; }

        #start-btn {
            background: #f3f0ea; color: #0a0a0a; border: none;
            padding: 20px 40px; font-family: "JetBrains Mono", monospace;
            font-size: 0.9rem; letter-spacing: 0.1em;
            text-transform: uppercase; cursor: pointer; border-radius: 4px;
        }

        @media (max-width: 800px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="grain"></div>

<div id="desktop-view">
    <div class="container">
        <div>
            <h1>Escanea, <em>observa</em>,<br>déjate llevar.</h1>
            <ul class="steps">
                <li>1. Abre esta página en tu celular</li>
                <li>2. Escanea el QR de abajo</li>
                <li>3. Apunta al marcador de la derecha</li>
            </ul>
            <div class="qr-block">
                <div id="qrcode"></div>
                <div style="font-family: 'JetBrains Mono'; font-size: 0.7rem; opacity: 0.6;">
                    <strong>QR DE ACCESO</strong><br>Escanea para iniciar
                </div>
            </div>
        </div>
        <div class="marker-card">
            <img src="./assets/intro.jpg" alt="Marcador">
        </div>
    </div>
</div>

<div id="mobile-landing">
    <h2>Astra <em>AR</em></h2>
    <p>Para una mejor experiencia, asegúrate de estar en un lugar iluminado.</p>
    <button id="start-btn">Entrar a la cámara</button>
</div>

<script>
    function isMobile() {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
            || (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent));
    }

    const desktop = document.getElementById('desktop-view');
    const mobile = document.getElementById('mobile-landing');

    if (isMobile()) {
        mobile.classList.add('active');
        
        document.getElementById('start-btn').addEventListener('click', () => {
            // REDIRECCIÓN A TU OTRO ARCHIVO
            window.location.href = 'mobile.html';
        });
    } else {
        desktop.classList.add('active');
        
        // Generar QR para PC
        new QRCode(document.getElementById('qrcode'), {
            text: window.location.href,
            width: 100, height: 100,
            colorDark: "#000000", colorLight: "#ffffff"
        });
    }
</script>

</body>
</html>
